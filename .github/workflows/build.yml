# Triggered build on June 25

name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache git libffi-dev libssl-dev \
          zlib1g-dev libsqlite3-dev libjpeg-dev libfreetype6-dev libbz2-dev \
          openjdk-17-jdk python3-pip unzip zip
        pip install --upgrade pip
        pip install --user buildozer cython

    - name: Trigger SDK folder creation
      run: |
        export PATH=$PATH:$HOME/.local/bin
        buildozer android clean || true
        buildozer android update || true

    - name: Accept SDK Licenses & Install Android Build Tools
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "build-tools;33.0.2" "platforms;android-33" "platform-tools" --licenses || true

    - name: Build APK with Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ttsmaker-apk
        path: bin/*.apk
