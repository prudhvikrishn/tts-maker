name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '11'

      - name: Install Android SDK
        run: |
          # Install Android SDK command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6200805_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mkdir -p $HOME/.android-sdk/cmdline-tools
          mv /tmp/cmdline-tools $HOME/.android-sdk/cmdline-tools/latest

          # Set environment variables
          echo "ANDROID_HOME=$HOME/.android-sdk" >> $GITHUB_ENV
          echo "$HOME/.android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0"

      - name: Build with Buildozer
        run: |
          # Your Buildozer or build command here
          buildozer android debug